<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Analytics</title>
    <!-- prePaint: script THƯỜNG (không phải module) — đặt data-theme trước lần vẽ đầu để theme tối
         không loé trắng. Chỉ bộ Ember ⇒ không ghi data-palette. Sáng/tối theo hệ thống, ghi giá
         trị ĐÃ GIẢI (light | dark), không bao giờ 'system'. prePaint.test.ts khoá. -->
    <script>
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
        apply();
        mq.addEventListener('change', apply);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
