<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Analytics</title>
    <!-- prePaint: a CLASSIC script (not a module) — sets data-theme before the first paint so the dark theme
         doesn't flash white. Ember palette only ⇒ no data-palette written. Light/dark follows the system, writes the
         RESOLVED value (light | dark), never 'system'. Locked by prePaint.test.ts. -->
    <script>
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
        apply();
        mq.addEventListener('change', apply);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
