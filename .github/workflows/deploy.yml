# Build + deploy GitHub Pages on push to main. PRs only run the check gates (no deploy).
# Must be enabled once: Settings → Pages → Source = "GitHub Actions".
# API URL: Settings → Secrets and variables → Actions → Variables → VITE_API_URL
# (not a secret — it ends up in the bundle; leave empty and the app runs in the "not configured" state).
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ONE gate job for both PRs and main ⇒ the gate set + order are identical by construction (kit 04: PR and
  # deploy must have the same gate set, same order). Add gates HERE, don't split into a separate job / file.
  # Secret PRIVACY_DENY (list of denied names, comma- or newline-separated): missing ⇒ check:bundle FAILs.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:test
      - run: npm run api:test
      - run: npm run check:test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: npm run check:bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          PRIVACY_DENY: ${{ secrets.PRIVACY_DENY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
